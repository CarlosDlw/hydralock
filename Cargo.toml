[package]
name = "hydralock"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
hkdf = "0.12"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
secrecy = "0.8"
argon2 = "0.5"
aes-gcm-siv = "0.11"
rand = "0.8"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
generic-array = "0.14"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = { version = "0.3", features = ["zeroize", "hazmat"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

