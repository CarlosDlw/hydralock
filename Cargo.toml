[package]
name = "hydralock"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.8"
argon2 = "0.5"
aes-gcm-siv = "0.11"
rand = "0.8"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
generic-array = "0.14"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

